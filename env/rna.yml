name: rna
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # 精简可移植规格:仅流水线实际使用的依赖(固定 CPU 版 xgboost)。
  # org.Mm/org.Hs.eg.db 为 stub 包,post-link 需联网;网络受限时由
  # scripts/00_install_deps.sh 自动分段安装源码包补装。
  - r-base>=4.4
  - r-ggplot2
  - r-glmnet
  - r-randomforest
  - r-xgboost
  - libxgboost=*=cpu*
  - r-proc
  - r-data.table
  - r-readxl
  - r-rmarkdown
  - bioconductor-limma
  - bioconductor-clusterprofiler
  - bioconductor-org.mm.eg.db
  - bioconductor-org.hs.eg.db
